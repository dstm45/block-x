name: "police de sécurité"
description: "est chargée de restreindre la lecture de certains fichiers par certains utilisateurs"

# Liste des fichiers individuels protégés
restricted_files:
  - paths:
      - "/home/monga/code/ebpf/syscall_logger/secret.txt"
      - "/home/monga/Documents/usb/code/arduio.ino"
    read:
      allow:
        user_uid: [0]
        binary_paths: ["/bin/cat", "/bin/nvim"]
    write:
      allow:
        user_uid: []
        binary_paths: ["/bin/cat"]
  - paths:
      - "/etc/shadow"
    read:
      allow:
        user_uid: [0]
        binary_paths: ["/bin/cat"]
    write:
      allow: null

# Liste des répertoires avec politiques granulaires
restricted_directories:
  - paths:
      - "/home/monga/test"
    read:
      allow:
        user_uid: [0]
        binary_paths: ["/bin/cat", "/bin/nvim"]
    write:
      allow:
        user_uid: []
        binary_paths: ["/bin/cat"]
